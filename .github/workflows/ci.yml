name: Hone CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  validate-domains:
    name: Validate domain packs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check all domain files follow naming convention
        run: |
          echo "Checking domain pack naming..."
          for file in domains/*.md; do
            basename=$(basename "$file")
            if [[ ! "$basename" =~ ^hone-.+\.md$ ]]; then
              echo "❌ $basename does not follow hone-[domain].md naming"
              exit 1
            fi
            echo "✓ $basename"
          done

      - name: Check no domain pack is empty
        run: |
          echo "Checking domain packs are non-empty..."
          for file in domains/*.md; do
            size=$(wc -c < "$file")
            if [ "$size" -lt 100 ]; then
              echo "❌ $(basename $file) is too small ($size bytes)"
              exit 1
            fi
            echo "✓ $(basename $file) ($size bytes)"
          done

      - name: Check hone.md is present and non-empty
        run: |
          if [ ! -s hone.md ]; then
            echo "❌ hone.md is missing or empty"
            exit 1
          fi
          echo "✓ hone.md ($(wc -c < hone.md) bytes)"

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [test, validate-domains]
    if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm install

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}